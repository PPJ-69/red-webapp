[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-first-media-browser-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpcore2>=2,<3",
    "httpx2>=2,<3",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
