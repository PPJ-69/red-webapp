name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.lock

      - name: Verify lockfiles and storage API policy
        run: |
          python frontend/scripts/check_lockfiles.py
          python frontend/scripts/check_storage_api.py
          python -m unittest discover -s frontend/tests/unit -p test_quality_gates.py -v

      - name: Verify backend
        env:
          APP_ENV: test
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .
        run: python -B -m unittest discover -s backend/tests -t . -v

      - name: Verify frontend
        working-directory: frontend
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ..
        run: |
          npm ci
          npm run check
          npm run test:unit
          npm run check:schema
          npm run test:schema
          npm run build

      - name: Verify idle filesystem compliance
        env:
          APP_ENV: test
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: .
        run: >-
          python -B tools/compliance/fs_monitor/run_scenario.py --root .
          -- python -B -c "from fastapi.testclient import TestClient; from backend.app.main import app; assert TestClient(app).get('/health/ready').status_code == 200"

      - name: Verify browser storage monitor
        run: |
          python -m playwright install --with-deps chromium
          PYTHONPATH=. python -B -m unittest frontend.tests.e2e.player_basic_spec -v
          PYTHONPATH=. python -B -m unittest frontend.tests.e2e.player_recovery_spec -v
          PYTHONPATH=. python -B -m unittest frontend.tests.e2e.player_controls_spec -v
          PYTHONPATH=. python -B -m unittest frontend.tests.e2e.player_navigation_spec -v
          python -B tools/compliance/browser_storage_check/check_browser_storage.py --self-check
          python -B -m unittest discover -s tests/compliance -t . -v

      - name: Run dependency vulnerability scans
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.lock
          npm audit --audit-level=high --prefix frontend
